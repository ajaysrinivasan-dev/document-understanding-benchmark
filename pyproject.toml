[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-understanding-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for OCR/layout and vision-language document extraction."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ocr = ["Pillow>=10,<12", "pytesseract>=0.3.13,<1", "PyMuPDF>=1.24,<2"]
vlm = ["Pillow>=10,<12", "PyMuPDF>=1.24,<2", "transformers>=4.45,<6", "torch>=2.4"]
ui = ["streamlit>=1.38,<2", "requests>=2.32,<3"]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
du-benchmark = "scripts.run_benchmark:main"
du-evaluate = "scripts.run_evaluation:main"

[tool.setuptools.packages.find]
include = ["app*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "reports", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
